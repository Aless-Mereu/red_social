[project]
name = "red-social"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AlessandroGarcia", email = "alessandro.garcia234@comunidadunir.net" }
]
requires-python = ">=3.12.3"
dependencies = [
    "pytest-mock>=3.16.0",
]

[project.scripts]
red-social = "red_social:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

